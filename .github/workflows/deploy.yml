name: Validate and deploy production

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: PostgreSQL validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: emerald_test
          POSTGRES_USER: emerald
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U emerald -d emerald_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: emerald_test
      DB_USERNAME: emerald
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      ADMIN_NAME: CI Administrator
      ADMIN_EMAIL: ci-admin@example.test

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql,intl,zip,bcmath,gd
          coverage: none

      - run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/{cache,sessions,testing,views}
          mkdir -p storage/logs
          chmod -R ug+rw bootstrap storage

      - run: composer validate --strict

      - run: composer install --no-interaction --prefer-dist

      - run: echo "APP_KEY=$(php artisan key:generate --show --no-ansi)" >> "$GITHUB_ENV"

      - run: echo "ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - run: php artisan migrate:fresh --seed --force

      - run: php artisan route:list

      - run: php artisan test

  deploy:
    name: Deploy to Hetzner
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Build and deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -eu
            cd /var/www/emerald-rozalia

            test -f .env || {
              echo "Missing /var/www/emerald-rozalia/.env" >&2
              exit 78
            }

            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose "$@"; }
            elif command -v docker-compose >/dev/null 2>&1; then
              compose() { docker-compose "$@"; }
            else
              echo "Docker Compose is not installed on the server." >&2
              exit 127
            fi

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            compose config --quiet
            compose build --pull app
            compose up -d --remove-orphans --wait --wait-timeout 180

            compose exec -T app php artisan migrate --force
            compose exec -T app php artisan optimize:clear
            compose exec -T app php artisan optimize
            compose exec -T app php artisan queue:restart || true

            compose ps
            curl --fail --silent --show-error --retry 12 --retry-delay 5               http://127.0.0.1:8080/up >/dev/null

            echo "Emerald Rozalia Docker deployment completed successfully."
