name: Validate and deploy production

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: PostgreSQL validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: emerald_test
          POSTGRES_USER: emerald
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U emerald -d emerald_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: emerald_test
      DB_USERNAME: emerald
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      ADMIN_NAME: CI Administrator
      ADMIN_EMAIL: ci-admin@example.test

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql,intl,zip,bcmath,gd
          coverage: none

      - name: Install dependencies
        run: |
          test -e .env || touch .env
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/{cache,sessions,testing,views}
          mkdir -p storage/logs
          chmod -R ug+rw bootstrap storage
          composer validate --strict
          composer install --no-interaction --prefer-dist
          echo "APP_KEY=$(php artisan key:generate --show --no-ansi)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Migrations and PostgreSQL feature tests
        run: |
          php artisan migrate:fresh --seed --force
          php artisan route:list
          vendor/bin/phpunit --configuration phpunit.pgsql.xml --display-warnings --fail-on-warning

      - name: Rehearse migration rollback and re-run
        run: |
          php artisan migrate:rollback --step=999 --force
          php artisan migrate --force
          php artisan db:seed --force
          php artisan migrate:status --no-ansi

      - name: Media browser acceptance
        if: github.ref == 'refs/heads/main'
        env:
          VIDEO_BROWSER_MODULES: ${{ runner.temp }}/video-browser
          VIDEO_ARTIFACTS: ${{ runner.temp }}/video-artifacts
          VIDEO_TEST_FILE: ${{ runner.temp }}/video-smoke.webm
          VIDEO_TEST_CAPTIONS: ${{ runner.temp }}/video-smoke.vtt
        run: |
          node --check public/js/videos.js
          node --check public/js/video-playback.js
          node --check public/js/spin-viewer.js
          node --check public/js/spins-admin.js
          node --check public/js/tryons-admin.js
          node --check public/js/tryon-tracking.js
          php artisan migrate:fresh --seed --force
          php tests/Browser/seed-video.php
          php tests/Browser/seed-spin.php
          php tests/Browser/seed-tryon.php
          npm install --no-audit --no-fund --prefix "$VIDEO_BROWSER_MODULES" playwright@1.55.0
          "$VIDEO_BROWSER_MODULES/node_modules/.bin/playwright" install --with-deps chromium
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y ffmpeg; }
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x084b2b:s=320x180:r=10 -t 3 -c:v libvpx-vp9 -b:v 500k "$VIDEO_TEST_FILE"
          printf 'WEBVTT\n\n00:00:00.000 --> 00:00:02.000\nEmerald video fixture\n' > "$VIDEO_TEST_CAPTIONS"
          php -d upload_max_filesize=20M -d post_max_size=25M artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/media-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/up >/dev/null; then break; fi
            sleep 1
          done
          node tests/Browser/video-dashboard.cjs
          php artisan cache:clear
          node tests/Browser/spin-dashboard.cjs
          php artisan cache:clear
          node tests/Browser/tryon-dashboard.cjs

      - name: Upload media browser evidence
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: media-browser-evidence
          path: ${{ runner.temp }}/video-artifacts
          if-no-files-found: ignore

  container:
    name: Container and release validation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Rehearse a Docker release
        run: bash deploy/ci-container.sh

  deploy:
    name: Deploy to Hetzner
    needs: [validate, container]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: emerald-production-release
      cancel-in-progress: false
    timeout-minutes: 35
    steps:
      - name: Check connection secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_PASSPHRASE: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          SERVER_FINGERPRINT: ${{ secrets.SERVER_FINGERPRINT }}
        run: |
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_SSH_PASSPHRASE SERVER_FINGERPRINT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production secret: $name"
              exit 78
            fi
          done
      - name: Deploy the tested main commit
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          port: 22
          command_timeout: 30m
          script: |
            set -eu
            umask 022
            cd /var/www/emerald-rozalia
            test -f .env
            test -z "$(git status --porcelain --untracked-files=no)"
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
              echo "A newer main commit exists. Run the latest validated workflow."
              exit 75
            fi
            git checkout main
            export DEPLOY_PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            git merge --ff-only "${{ github.sha }}"
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            bash deploy/docker-deploy.sh
