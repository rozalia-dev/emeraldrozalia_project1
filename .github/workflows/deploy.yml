name: Validate and deploy production

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: PostgreSQL validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: emerald_test
          POSTGRES_USER: emerald
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U emerald -d emerald_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: emerald_test
      DB_USERNAME: emerald
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      ADMIN_NAME: CI Administrator
      ADMIN_EMAIL: ci-admin@example.test

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql,intl,zip,bcmath,gd
          coverage: none

      - run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/{cache,sessions,testing,views}
          mkdir -p storage/logs
          chmod -R ug+rw bootstrap storage

      - run: composer validate --strict

      - run: composer install --no-interaction --prefer-dist

      - run: echo "APP_KEY=$(php artisan key:generate --show --no-ansi)" >> "$GITHUB_ENV"

      - run: echo "ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - run: php artisan migrate:fresh --seed --force

      - run: php artisan route:list

      - run: php artisan test

  container:
    name: Container and release validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          bash -n deploy/docker-deploy.sh
          sh -n deploy/docker-entrypoint.sh
      - name: Build using restrictive source permissions
        run: |
          cp .env.example .env
          printf '\nAPP_KEY=base64:%s\nDB_PASSWORD=ci-only-password\n' "$(openssl rand -base64 32)" >> .env
          mkdir -p public/storage
          git ls-files -z | xargs -0 chmod go-rwx
          docker compose config --quiet
          docker compose build app
      - name: Check PHP user access and storage link
        run: |
          docker compose run --rm --no-deps --user www-data app php artisan --version
          docker compose run --rm --no-deps --user www-data app sh -ec 'test -L public/storage; test -d public/storage; test -r vendor/autoload.php; test -w storage/framework/views; test -w bootstrap/cache'
      - name: Validate fresh database and nginx
        run: |
          git ls-files -z | xargs -0 chmod go+rX
          docker compose up -d --no-build --wait --wait-timeout 180 db redis app
          docker compose exec -T --user www-data app php artisan migrate --force
          docker compose exec -T --user www-data app php artisan optimize
          docker compose up -d --no-build --wait --wait-timeout 180 nginx
          curl --fail --silent --show-error http://127.0.0.1:8080/up
          DEPLOY_BACKUP_DIR="$RUNNER_TEMP/emerald-backups" DEPLOY_HEALTHCHECK_URL=http://127.0.0.1:8080/up bash deploy/docker-deploy.sh
          sleep 10
          for service in worker scheduler; do
            test -n "$(docker compose ps --status running -q "$service")"
          done
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --tail=80
      - name: Clean up CI containers
        if: always()
        run: docker compose --profile background down --volumes

  deploy:
    name: Deploy to Hetzner
    needs: [validate, container]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: emerald-production-release
      cancel-in-progress: false
    timeout-minutes: 35
    steps:
      - name: Check connection secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_PASSPHRASE: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          SERVER_FINGERPRINT: ${{ secrets.SERVER_FINGERPRINT }}
        run: |
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_SSH_PASSPHRASE SERVER_FINGERPRINT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production secret: $name"
              exit 78
            fi
          done
      - name: Deploy the tested main commit
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          port: 22
          command_timeout: 30m
          script: |
            set -eu
            umask 022
            cd /var/www/emerald-rozalia
            test -f .env
            test -z "$(git status --porcelain --untracked-files=no)"
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
              echo "A newer main commit exists. Run the latest validated workflow."
              exit 75
            fi
            git checkout main
            export DEPLOY_PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            git merge --ff-only "${{ github.sha }}"
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            bash deploy/docker-deploy.sh
