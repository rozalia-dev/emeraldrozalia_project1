name: Validate and deploy production

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PostgreSQL validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: emerald_test
          POSTGRES_USER: emerald
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U emerald -d emerald_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: emerald_test
      DB_USERNAME: emerald
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      ADMIN_NAME: CI Administrator
      ADMIN_EMAIL: ci-admin@example.test

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql,intl,zip,bcmath,gd
          coverage: none

      - run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/{cache,sessions,testing,views}
          mkdir -p storage/logs
          chmod -R ug+rw bootstrap storage

      - run: composer validate --strict

      - run: composer install --no-interaction --prefer-dist

      - run: echo "APP_KEY=$(php artisan key:generate --show --no-ansi)" >> "$GITHUB_ENV"

      - run: echo "ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - run: php artisan migrate:fresh --seed --force

      - run: php artisan route:list

      - run: php artisan test

  deploy:
  needs: validate
  if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
  runs-on: ubuntu-latest

  steps:
    - name: Deploy
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /var/www/emerald-rozalia
          git pull --ff-only origin main
          bash ./deploy/deploy.sh