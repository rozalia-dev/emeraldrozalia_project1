name: Laravel PostgreSQL CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: emerald_test, POSTGRES_USER: emerald, POSTGRES_PASSWORD: emerald }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U emerald -d emerald_test" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      APP_ENV: testing
      APP_KEY: base64:VGhpcy1pcy1hLXRlc3Qta2V5LWZvci1DSTAwMDAwMDA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: emerald_test
      DB_USERNAME: emerald
      DB_PASSWORD: emerald
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      ADMIN_NAME: CI Administrator
      ADMIN_EMAIL: ci-admin@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: pdo_pgsql,intl,zip,bcmath,gd, coverage: none }
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Generate ephemeral seeder password
        run: echo "ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: php artisan migrate:fresh --seed --force
      - run: php artisan test
