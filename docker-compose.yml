services:
  app: &app
    build: .
    image: emerald-rozalia-app
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
    volumes:
      - storage:/var/www/html/storage
      - public-assets:/var/www/html/storage/app/public
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    <<: *app
    profiles: [background]
    user: www-data
    command: [php, artisan, 'queue:work', '--sleep=3', '--tries=3', '--timeout=60', '--max-time=3600']
    stop_grace_period: 90s
    healthcheck:
      disable: true
  scheduler:
    <<: *app
    profiles: [background]
    user: www-data
    command: [php, artisan, 'schedule:work']
    stop_grace_period: 90s
    healthcheck:
      disable: true
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./:/var/www/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public-assets:/var/www/html/public/storage:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
  whatsapp-engine:
    build:
      context: ./services/whatsapp-engine
    image: emerald-rozalia-whatsapp-engine
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      WHATSAPP_ENGINE_TOKEN: ${COMMUNICATION_WHATSAPP_TOKEN:-}
      LARAVEL_WEBHOOK_SECRET: ${COMMUNICATION_WHATSAPP_WEBHOOK_SECRET:-}
      LARAVEL_INBOUND_URL: http://nginx/api/v1/communication/whatsapp/inbound
      LARAVEL_DELIVERY_WEBHOOK_URL: http://nginx/api/v1/communication/webhooks/whatsapp
      WHATSAPP_SESSION_PATH: /data/.wwebjs_auth
      WHATSAPP_LEDGER_PATH: /data/.wwebjs_auth/delivery-ledger.json
      WHATSAPP_LEDGER_LIMIT: 5000
      WHATSAPP_CLIENT_ID: emerald-rozalia
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_NO_SANDBOX: "true"
    volumes:
      - whatsapp-session:/data/.wwebjs_auth
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/status',{headers:{Authorization:'Bearer '+process.env.WHATSAPP_ENGINE_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 8s
      start_period: 45s
      retries: 5
    depends_on:
      nginx:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: emerald_rozalia
      POSTGRES_USER: emerald_rozalia
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emerald_rozalia -d emerald_rozalia"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes: ["pgsql:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes: {pgsql: {}, storage: {}, public-assets: {}, whatsapp-session: {}}
