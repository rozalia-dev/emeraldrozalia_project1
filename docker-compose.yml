services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
    volumes: ["storage:/var/www/html/storage"]
    depends_on: [db, redis]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./:/var/www/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage:ro
    depends_on: [app]
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: emerald_rozalia
      POSTGRES_USER: emerald_rozalia
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emerald_rozalia -d emerald_rozalia"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes: ["pgsql:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
volumes: {pgsql: {}, storage: {}}
