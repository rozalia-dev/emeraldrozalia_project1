openapi: 3.1.0
info:
  title: Emerald Rozalia Project 1 API
  version: 1.0.0
  description: Versioned public catalog, published-banner and authenticated Communication Center Email Dashboard contract for Project 1.
servers:
  - url: /
paths:
  /api/v1/products:
    get:
      operationId: listProducts
      summary: List published products
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: category, in: query, schema: { type: string, maxLength: 120 } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_low, price_high, name] } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 48, default: 12 } }
      responses:
        '200':
          description: Paginated product collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedProducts' }
  /api/v1/products/{slug}:
    get:
      operationId: showProduct
      summary: Show one published product
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '404': { description: Product not found or not published }
  /api/v1/banners:
    get:
      operationId: listPublishedBanners
      summary: List currently published banners
      parameters:
        - { name: position, in: query, schema: { type: string } }
        - { name: device, in: query, schema: { type: string, enum: [desktop, tablet, mobile] } }
      responses:
        '200':
          description: Paginated banner collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedBanners' }
  /api/v1/communication/email:
    get:
      operationId: listCommunicationEmailConversations
      summary: List tenant-scoped email conversations
      security: [{ adminSession: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: customer, in: query, schema: { type: string, maxLength: 120 } }
        - { name: order, in: query, schema: { type: string, maxLength: 120 } }
        - { name: uid, in: query, schema: { type: string, maxLength: 120 } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string, enum: [new, open, pending, closed] } }
        - { name: priority, in: query, schema: { type: string, enum: [low, normal, high, urgent] } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Paginated tenant-scoped email conversations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedCommunicationConversations' }
        '401': { description: Authentication required }
        '403': { description: Administrator permission required }
  /api/v1/communication/email/{conversation}:
    parameters:
      - { name: conversation, in: path, required: true, description: Conversation UUID, schema: { type: string, format: uuid } }
    get:
      operationId: showCommunicationEmailConversation
      summary: Show one email conversation and message history
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Email conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationConversationResponse' }
        '404': { description: Email conversation not found in the active company }
    patch:
      operationId: updateCommunicationEmailConversation
      summary: Update email conversation state
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [new, open, pending, closed] }
                priority: { type: string, enum: [low, normal, high, urgent] }
                assigned_to: { type: [integer, 'null'] }
                follow_up_at: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: Updated email conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationConversationResponse' }
        '422': { description: Validation error }
        '403': { description: Administrator permission required }
  /api/v1/communication/email/{conversation}/messages:
    parameters:
      - { name: conversation, in: path, required: true, description: Conversation UUID, schema: { type: string, format: uuid } }
    post:
      operationId: replyToCommunicationEmailConversation
      summary: Queue an email conversation reply
      security: [{ adminSession: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 120 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 10000 }
      responses:
        '200':
          description: Queued message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationMessageResponse' }
        '422': { description: Validation error }
        '403': { description: Administrator permission required }
  /api/v1/communication/email/{conversation}/audit:
    parameters:
      - { name: conversation, in: path, required: true, description: Conversation UUID, schema: { type: string, format: uuid } }
    get:
      operationId: listCommunicationEmailAudit
      summary: List redacted audit entries for an email conversation
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Paginated redacted audit entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedCommunicationAudit' }
        '403': { description: Administrator permission required }
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Product:
      type: object
      required: [public_uuid, slug, name, sku, price, currency, stock_status]
      properties:
        public_uuid: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        sku: { type: string }
        description: { type: [string, 'null'] }
        price: { type: [string, 'null'] }
        compare_price: { type: [string, 'null'] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        image_url: { type: [string, 'null'], format: uri-reference }
        stock_status: { type: string, enum: [in_stock, out_of_stock] }
    Banner:
      type: object
      required: [public_uuid, title, type, position, priority]
      properties:
        public_uuid: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        type: { type: string }
        position: { type: string }
        target_url: { type: [string, 'null'], format: uri-reference }
        target_type: { type: [string, 'null'] }
        image_url: { type: [string, 'null'], format: uri-reference }
        alt_text: { type: [string, 'null'] }
        aria_label: { type: [string, 'null'] }
        starts_at: { type: [string, 'null'], format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        priority: { type: integer }
        device_visibility: { type: array, items: { type: string } }
    Pagination:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    PaginatedProducts:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Product' } }
        meta: { $ref: '#/components/schemas/Pagination' }
    ProductResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Product' }
    PaginatedBanners:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Banner' } }
        meta: { $ref: '#/components/schemas/Pagination' }
    CommunicationConversation:
      type: object
      required: [uuid, channel, status, priority]
      properties:
        uuid: { type: string, format: uuid }
        channel: { type: string, const: email }
        contact: { type: [string, 'null'] }
        subject: { type: [string, 'null'] }
        status: { type: string, enum: [new, open, pending, closed] }
        priority: { type: string, enum: [low, normal, high, urgent] }
        consent:
          type: object
          properties:
            captured_at: { type: [string, 'null'], format: date-time }
            version: { type: [string, 'null'] }
        customer: { type: [object, 'null'], additionalProperties: true }
        order: { type: [object, 'null'], additionalProperties: true }
        assigned_agent: { type: [object, 'null'], additionalProperties: true }
        follow_up_at: { type: [string, 'null'], format: date-time }
        metadata: { type: object, additionalProperties: true }
        message_count: { type: [integer, 'null'], minimum: 0 }
        messages: { type: array, items: { $ref: '#/components/schemas/CommunicationMessage' } }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
    CommunicationMessage:
      type: object
      required: [uuid, direction, delivery_status]
      properties:
        uuid: { type: string, format: uuid }
        conversation_uuid: { type: [string, 'null'], format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        body: { type: [string, 'null'] }
        delivery_status: { type: [string, 'null'] }
        provider_message_id: { type: [string, 'null'] }
        delivery_attempts: { type: integer, minimum: 0 }
        sent_at: { type: [string, 'null'], format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        failed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
    CommunicationAudit:
      type: object
      required: [uuid, action, subject_uuid]
      properties:
        uuid: { type: string, format: uuid }
        actor_uuid: { type: [string, 'null'], format: uuid }
        action: { type: string }
        subject_uuid: { type: [string, 'null'], format: uuid }
        request_id: { type: [string, 'null'] }
        ip_address: { type: [string, 'null'] }
        before: { type: [object, 'null'], additionalProperties: true }
        after: { type: [object, 'null'], additionalProperties: true }
        created_at: { type: [string, 'null'], format: date-time }
    CommunicationConversationResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CommunicationConversation' }
    CommunicationMessageResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CommunicationMessage' }
    PaginatedCommunicationConversations:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CommunicationConversation' } }
        meta: { $ref: '#/components/schemas/Pagination' }
    PaginatedCommunicationAudit:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CommunicationAudit' } }
        meta: { $ref: '#/components/schemas/Pagination' }
